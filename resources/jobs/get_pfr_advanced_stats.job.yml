resources:
  jobs:
    get_pfr_advanced_stats:
      notification_settings:
        no_alert_for_skipped_runs: false
      name: Get PFR Advanced Stats
      parameters:
      - default: k2
        name: catalog
      - default: load_pfr_advstats
        name: function
      - default: pfr
        name: schema
      - default: None
        name: seasons
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule: ${var.schedule_daily}
      tags:
        project: k2
        source: nflreadpy
      tasks:
      - disabled: false
        email_notifications: {}
        environment_key: Default
        run_if: ALL_SUCCESS
        spark_python_task:
          parameters:
          - --catalog
          - '{{job.parameters.catalog}}'
          - --schema
          - '{{job.parameters.schema}}'
          - --function
          - '{{job.parameters.function}}'
          - --job_name
          - '{{job.name}}'
          - --seasons
          - '{{job.parameters.seasons}}'
          - --table
          - defense_week
          - --stat_type
          - def
          - --summary_level
          - week
          python_file: src/main.py
          source: GIT
        task_key: load_pfr_advstats_def_week
        timeout_seconds: 0
        webhook_notifications: {}
      - depends_on:
        - task_key: load_pfr_advstats_def_week
