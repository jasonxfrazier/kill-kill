
name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Ruff
        run: uv tool install ruff

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
