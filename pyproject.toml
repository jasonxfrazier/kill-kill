[project]
name = "kill-kill"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
# Lint and format everything under src/ plus any top-level Python files.
include = ["src/**/*.py", "*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort-style import sorting (I),
# pyupgrade (UP), flake8-bugbear (B), and naming conventions (N).
select = ["E", "W", "F", "I", "UP", "B", "N"]
ignore = [
    "E501", # Line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["./src"]

[tool.databricks.environment]
environment_version = "6"
